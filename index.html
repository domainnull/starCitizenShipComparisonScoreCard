<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ship Scorecard</title>
  <link rel="stylesheet" href="viewer/viewer.css">
</head>
<body>
  <main id="app">
    <noscript><p>The leaderboard needs JavaScript turned on.</p></noscript>
    <p id="loading">Loading results…</p>
  </main>
  <!--
    Plain script tags, no server needed: this page works from file:// and from GitHub Pages.
    results/leaderboard.js       written by scripts/score.py; sets window.scorecardResults
    rubricVersions/index.js      written by scripts/score.py; lists old results snapshots
    viewer/viewer.js             the viewer itself, versioned on its own (VIEWER_VERSION)
  -->
  <script src="results/leaderboard.js"></script>
  <script src="rubricVersions/index.js"></script>
  <script src="viewer/viewer.js"></script>
</body>
</html>
