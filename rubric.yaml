# Mobile base scorecard rubric.
# A ship is scored as a solo mobile base: mine, salvage, defend and sleep off-planet,
# hidden in space, as a thought experiment where the marketing comes true.
#
# Versioning (semver): major = old scores are not comparable, minor = new rule or
# category, patch = fix. Every version gets a git tag (rubric-vX.Y.Z) and an entry in
# rubricVersions/DECISIONS.md. Old rubric files live in rubricVersions/.
rubricVersion: 3.0.0

# Tiers and weights. Each line scores 0-5 unless it says otherwise.
tiers:
  needed:
    weight: 1.0
    categories: [mining, refining, medical, salvageRepair, manufacturing, defense, livingQuarters, cargo, commuter]
  desired:
    weight: 0.5
    categories: [engineering]

categories:
  mining:
    displayName: Mining
    max: 5
    levels: {capital: 5, mole: 4, prospector: 3, golem: 2, roc: 1, none: 0}
  refining:
    displayName: Refining
    max: 5
    # oreAndFuel = refines ore and makes fuel; oreOrFuel = one of the two;
    # fuelOnlyPartial = some fuel only; roomForLater = room for a future refinery ship.
    levels: {oreAndFuel: 5, oreOrFuel: 4, fuelOnlyPartial: 2, roomForLater: 1, none: 0}
    carriedRefineryScore: 3
  medical:
    displayName: Medical
    max: 5
    levels: {tier1: 4, tier2: 3, tier3: 2, medArea: 1, none: 0}
    multipleBedsBonus: 1        # two or more medical beds, native and carried together
  salvageRepair:
    displayName: Salvage and repair
    max: 5
    levels: {constructionSalvage: 4, constructionPieces: 3, rubbleMedium: 2, rubbleSmall: 1, none: 0}
    repairBonus: {none: 0, smallShips: 1, base: 2}
  manufacturing:
    displayName: Manufacturing
    max: 5
    levels: {largeFabricator: 5, component: 4, personalGear: 3, limitedStation: 2, roomForLater: 1, none: 0}
  defense:
    displayName: Defense
    max: 5
    # Energy-capable mounts only, no missiles. Ballistic-by-default mounts count when the
    # mount can take energy guns (record `energyCapable: false` otherwise).
    gunScore: {S1: 0, S2: 0, S3: 0.25, S4: 0.5, S5: 1, S6: 2.5, S7: 5}
    largeBaseToughnessBonus: 1
    # The "Polaris and larger" group is its own list, not CIG size.
    largeBases: [rsiCPolaris, aegsCIdrisP, drakCKraken]
    fighter:
      multiplier: 2
      offset: -0.5
  livingQuarters:
    displayName: Living quarters
    max: 5
    perBed: 1
    maxBedPoints: 4
    recSpace: 1
  cargo:
    displayName: Cargo and hauling
    max: 10
    maneuverabilityMax: 5       # anchors: Constellation Andromeda 5, Ironclad 0
    capacity: {minScu: 200, maxScu: 800, maxPoints: 5}
    carriedHaulerMultiplier: 0.5
  commuter:
    displayName: Shuttle
    max: 1                      # has one or not; needed, but a base without one still ranks
    native: 1
    carried: 1
  engineering:
    displayName: Engineering ship
    max: 5
    native: 5
    carried: 4

# A required role (the needed tier) must be filled by the base, a carried ship or "noRoom".
# noRoom means the base has no room left for a ship that would fill it.
noRoom:
  score: 0

carried:
  multiplier: 0.8
  rounding: down               # to a whole point
  minimum: 1
  minimumByCategory: {mining: 0.5}
  appliesTo: [mining, medical, salvageRepair, manufacturing]

rounding:
  halfPoints: [defense, cargo]   # these lines keep half points, rounded down

# Rules in words, tagged with the categories they touch. The script implements each one.
rules:
  - id: carriedRoleShip
    categories: [mining, medical, salvageRepair, manufacturing]
    text: A carried ship scores 0.8 of its own score, rounded down, with a minimum of 1 (0.5 for mining) when its own score is above 0.
  - id: requiredRoles
    categories: [mining, refining, medical, salvageRepair, manufacturing, defense, livingQuarters, cargo, commuter]
    text: Every needed role must be filled by the base itself, a carried ship or No room. A role the base has nothing built in for can't be left as built in. No room scores 0 in that role.
  - id: roleShipUsesSpace
    categories: [mining, medical, salvageRepair, defense, cargo, commuter, engineering]
    text: A carried ship in a role is aboard and its cargo space comes off the base's cargo. The role scores the higher of the base's own and the ship's.
  - id: extraShips
    categories: [all]
    text: Extra ships fill no role and score nothing, cargo included. They hold a note on what else fits and aren't validated.
  - id: locations
    categories: [all]
    text: A carried ship goes in one of the base's locations (hangar, landing pad, cargo hold, vehicle bay). Locations have no ship count; which ships fit together is a fact of the layout.
  - id: loadoutOnly
    categories: [mining, medical, salvageRepair, defense, cargo, commuter, engineering]
    text: Carried roles count only from one layout whose ships fit together. A ship ranks by its best layout.
  - id: bestSeat
    categories: [defense]
    text: Defense counts the best single seat (pilot or one turret). Energy-capable mounts only; missiles never count.
  - id: carriedFighter
    categories: [defense]
    text: On a base not in largeBases, a carried fighter scores 2 x its own best-seat gun score - 0.5, and defense takes the higher of the base and the fighter.
  - id: largeBaseToughness
    categories: [defense]
    text: Bases in largeBases get +1 on their own best seat (cap 5). Carried fighters score nothing there.
  - id: multipleBeds
    categories: [medical]
    text: +1 medical when the base and its carried ships hold two or more medical beds in total.
  - id: repairBonus
    categories: [salvageRepair]
    text: +1 when the base repairs, refuels and rearms the small ships it carries, +2 when it repairs itself or larger ships. Line capped at 5.
  - id: livingQuarters
    categories: [livingQuarters]
    text: 1 point per native bed, up to 4, plus 1 for rec space.
  - id: cargoLine
    categories: [cargo]
    text: Cargo is 0-10. Half is manoeuvrability (0-5, judgement, the higher of the base and 0.5 x a carried hauler). Half is capacity, 0 at 200 SCU or less up to 5 at 800 SCU or more, after subtracting the cargo space the layout's carried ships take up. This is also the spare-room score, since room left means cargo space left.
  - id: commuter
    categories: [commuter]
    text: Shuttle is 1 when the base has a commuter, built in or carried, and 0 when it has none. A command module that only detaches the bridge earns nothing.
  - id: ranges
    categories: [all]
    text: Values that rest on marketing or estimated fits are written as {low, high}. The script scores the low case and the high case.
